<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a0508"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rutina"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><title>Rutina</title>
<style>
:root{--a:#ff3b4e;--tx:#fff;--mu:rgba(255,255,255,.58);--g:rgba(255,255,255,.1);--gb:rgba(255,255,255,.2)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%;background:#16040a;color:var(--tx);font:500 16px/1.3 -apple-system,"SF Pro Display",system-ui,sans-serif;overscroll-behavior:none}
body:before,body:after{content:"";position:fixed;width:70vmax;height:70vmax;border-radius:50%;filter:blur(70px);opacity:.55;z-index:-1;background:var(--a);top:-35vmax;left:-25vmax;animation:fl 18s ease-in-out infinite alternate}
body:after{background:#7a0f2a;top:auto;left:auto;bottom:-35vmax;right:-30vmax;animation-delay:-9s}
@keyframes fl{to{transform:translate(12vmax,10vmax) scale(1.15)}}
.gl{background:var(--g);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--gb);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 8px 30px rgba(0,0,0,.25);border-radius:24px}
button,input{font:inherit;color:inherit;border:0;background:none;outline:0}button{cursor:pointer;transition:transform .15s}button:active{transform:scale(.92)}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px 0}
header{display:flex;align-items:center;gap:12px;padding:10px 0}
header h1{font-size:26px;font-weight:800;letter-spacing:-.5px}header small{display:block;color:var(--mu);font-size:13px;text-transform:capitalize}
.rb{width:42px;height:42px;border-radius:16px;display:grid;place-items:center;flex:none}.rb svg{width:20px}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;overflow:auto;padding:4px 0 150px;scrollbar-width:none}
.wk{display:flex;gap:7px;margin-bottom:12px}.wk button{flex:1;padding:9px 0;border-radius:18px;font-size:12px;color:var(--mu)}.wk b{display:block;font-size:18px;color:var(--tx)}
.wk .s{background:var(--a);color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--a) 60%,transparent)}.wk .s b{color:#fff}.wk .t:not(.s){outline:2px solid var(--a)}
.row{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px;animation:in .3s both}.row.d{opacity:.45}.row.d .n{text-decoration:line-through}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.ic{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 28%,transparent);color:var(--c)}.ic svg{width:23px}
.row .i{flex:1;min-width:0}.n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.m{font-size:12.5px;color:var(--mu);display:flex;gap:8px;align-items:center}.m svg{width:12px;vertical-align:-1px}
.ck{width:34px;height:34px;border-radius:50%;border:2px solid var(--mu);display:grid;place-items:center;flex:none;color:#fff}.ck svg{width:18px;opacity:0}.d .ck{background:var(--a);border-color:var(--a)}.d .ck svg{opacity:1}
.fire{color:#ffb020;font-weight:700}
nav{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 10px);display:flex;padding:6px;border-radius:30px}
nav button{flex:1;padding:8px 0;border-radius:24px;font-size:11px;color:var(--mu);display:grid;justify-items:center;gap:2px}nav svg{width:22px}nav .s{background:rgba(255,255,255,.16);color:#fff}
.fab{position:fixed;right:22px;bottom:calc(env(safe-area-inset-bottom) + 86px);width:58px;height:58px;border-radius:22px;background:var(--a);display:grid;place-items:center;box-shadow:0 10px 26px color-mix(in srgb,var(--a) 55%,transparent)}.fab svg{width:26px}
.sc{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:flex;align-items:flex-end;z-index:9;animation:fi .2s}@keyframes fi{from{opacity:0}}
.sh{width:100%;max-height:88%;overflow:auto;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px);border-radius:32px 32px 0 0;background:rgba(40,10,18,.72);animation:up .3s cubic-bezier(.2,.9,.3,1)}@keyframes up{from{transform:translateY(100%)}}
.sh h2{margin-bottom:14px}.in{width:100%;padding:14px;border-radius:16px;background:var(--g);border:1px solid var(--gb);margin-bottom:12px}
.chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.chips button{flex:1;min-width:38px;padding:10px 0;border-radius:14px;background:var(--g);font-size:13px}.chips .s{background:var(--a)}
.btn{width:100%;padding:15px;border-radius:18px;background:var(--a);font-weight:700;margin-top:4px}.btn.g{background:var(--g);margin-top:8px}.lb{font-size:12.5px;color:var(--mu);margin:0 0 6px 4px}
.dr{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:320px;z-index:8;padding:calc(env(safe-area-inset-top) + 20px) 16px;border-radius:0 32px 32px 0;background:rgba(40,10,18,.75);animation:sl .3s cubic-bezier(.2,.9,.3,1)}@keyframes sl{from{transform:translateX(-100%)}}
.dr button.it{display:flex;gap:12px;align-items:center;width:100%;padding:14px;border-radius:16px;text-align:left}.dr button.it svg{width:22px}
.big{font-size:64px;font-weight:200;text-align:center;font-variant-numeric:tabular-nums;margin:24px 0}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0}.grid i{aspect-ratio:1;border-radius:8px;background:var(--g)}.grid i.o{background:var(--a)}.grid i.x{background:rgba(255,60,60,.25);outline:1px solid rgba(255,60,60,.6)}
.st{display:flex;gap:8px;margin:8px 0}.st div{flex:1;padding:12px;text-align:center;border-radius:18px;background:var(--g)}.st b{display:block;font-size:22px}.st span{font-size:11px;color:var(--mu)}
.dots{display:flex;gap:5px}.dots i{width:18px;height:18px;border-radius:6px;background:var(--g);display:block}.dots i.o{background:var(--a)}.dots i.x{background:rgba(255,60,60,.3)}
.sw{display:flex;gap:10px;margin:8px 0 16px}.sw button{flex:1;height:44px;border-radius:16px}
.emp{text-align:center;color:var(--mu);padding:50px 20px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div id="app"></div>
<script>
const I={star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',play:'<rect x="3" y="5" width="18" height="14" rx="4"/><path d="M10 9l5 3-5 3z"/>',cam:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/>',chart:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',book:'<path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2zM4 19a2 2 0 012-2h13"/>',gym:'<path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>',drop:'<path d="M12 3s6 6.5 6 11a6 6 0 01-12 0c0-4.5 6-11 6-11z"/>',moon:'<path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/>',code:'<path d="M8 8l-5 4 5 4M16 8l5 4-5 4M14 5l-4 14"/>',music:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',heart:'<path d="M12 20s-8-5-8-11a4.5 4.5 0 018-2.5A4.5 4.5 0 0120 9c0 6-8 11-8 11z"/>'};
const K=[[/youtube|video|yt|canal/,'play'],[/insta|foto|tiktok|redes|contenido|reel|ugc/,'cam'],[/trad|bolsa|invert|dinero|ahorr/,'chart'],[/lee|libro|estud|curso|idioma/,'book'],[/gym|ejerc|entren|correr|deport|pesas/,'gym'],[/agua|beber/,'drop'],[/dorm|sue|noche/,'moon'],[/code|program|web|app/,'code'],[/music|guitar|piano|cant/,'music'],[/medit|salud|amor|famil/,'heart']];
const P={chk:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',plus:'<path d="M12 5v14M5 12h14"/>',bell:'<path d="M6 17V11a6 6 0 0112 0v6l2 2H4zM10 21h4"/>',home:'<path d="M4 11l8-7 8 7v9H4z"/>',list:'<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',flag:'<path d="M5 21V4M5 4h13l-2 4 2 4H5"/>',clk:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',pal:'<circle cx="12" cy="12" r="9"/><circle cx="8" cy="10" r="1"/><circle cx="12" cy="7.5" r="1"/><circle cx="16" cy="10" r="1"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="4"/><path d="M3 10h18M8 3v4M16 3v4"/>'};
const sv=(p)=>`<svg viewBox="0 0 24 24">${p}</svg>`;
let S=JSON.parse(localStorage.rutina||'{"items":[],"acc":"#ff3b4e"}'),tab='hoy',sel=key(new Date()),dr=0;
const save=()=>{localStorage.rutina=JSON.stringify(S);document.documentElement.style.setProperty('--a',S.acc)};
function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const dt=k=>new Date(k+'T12:00'),add=(k,n)=>{const d=dt(k);d.setDate(d.getDate()+n);return key(d)},TD=()=>key(new Date());
const ap=(it,k)=>it.type=='t'?it.date==k:k>=it.created&&(!it.days||it.days.includes(dt(k).getDay()));
const end=it=>{const[h,m]=it.start.split(':').map(Number),t=h*60+m+(+it.dur||0);return String(Math.floor(t/60)%24).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
function stats(it){let s=0,b=0,c=0,tot=0,k=it.created,t=TD(),run=0;for(;k<=t;k=add(k,1))if(ap(it,k)){if(it.done[k]){run++;c++;tot++;b=Math.max(b,run)}else if(k!=t){run=0;tot++}}
 for(k=t,s=0;k>=it.created&&s<400;k=add(k,-1)){if(!ap(it,k))continue;if(it.done[k])s++;else if(k!=t)break}return{s,b,pct:tot?Math.round(100*c/tot):0}}
const icoOf=n=>{n=n.toLowerCase();for(const[r,i]of K)if(r.test(n))return i;return'star'};
const colOf=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return`hsl(${h} 90% 68%)`};
const ico=it=>`<span class="ic" style="--c:${it.color}">${sv(I[it.icon])}</span>`;
function row(it,k){const d=it.done[k];return`<div class="gl row ${d?'d':''}" onclick="edit('${it.id}')">${ico(it)}<div class="i"><div class="n">${it.name}</div><div class="m"><span>${it.type=='h'?'Hábito':'Tarea'}</span><span>${sv(P.bell)} ${it.start}–${end(it)}</span>${it.type=='h'&&stats(it).s>1?`<span class="fire">${stats(it).s} días</span>`:''}</div></div><button class="ck" onclick="event.stopPropagation();tg('${it.id}','${k}')">${sv(P.chk)}</button></div>`}
function tg(id,k){const it=S.items.find(i=>i.id==id);it.done[k]?delete it.done[k]:it.done[k]=1;save();render()}
function render(){const T={hoy:['Hoy',P.home],hab:['Hábitos',P.flag],tar:['Tareas',P.list],rel:['Reloj',P.clk]};
 const d=dt(sel),ttl=sel==TD()?'Rutina':d.toLocaleDateString('es',{weekday:'long'});
 let v='';
 if(tab=='hoy'){let w='';for(let i=-3;i<=3;i++){const k=add(sel,i),x=dt(k);w+=`<button class="gl ${k==sel?'s':''} ${k==TD()?'t':''}" style="border-radius:18px" onclick="sel='${k}';render()">${x.toLocaleDateString('es',{weekday:'short'}).slice(0,3)}<b>${x.getDate()}</b></button>`}
  const L=S.items.filter(i=>ap(i,sel)).sort((a,b)=>!!a.done[sel]-!!b.done[sel]||a.start.localeCompare(b.start));
  v=`<div class="wk">${w}</div>`+(L.length?L.map(i=>row(i,sel)).join(''):`<div class="emp">Nada programado este día.<br>Toca + para crear un hábito o una tarea.</div>`)}
 if(tab=='hab'){const H=S.items.filter(i=>i.type=='h');v=H.length?H.map(it=>{const st=stats(it);let dots='';for(let i=-6;i<=0;i++){const k=add(TD(),i);dots+=`<i class="${it.done[k]?'o':ap(it,k)&&k<TD()?'x':''}"></i>`}return`<div class="gl row" onclick="edit('${it.id}')">${ico(it)}<div class="i"><div class="n">${it.name}</div><div class="dots" style="margin-top:6px">${dots}</div></div><div style="text-align:right"><b>${st.pct}%</b><div class="m fire">${st.s} días</div></div></div>`}).join(''):'<div class="emp">Aún no tienes hábitos.</div>'}
 if(tab=='tar'){const T2=S.items.filter(i=>i.type=='t').sort((a,b)=>a.date.localeCompare(b.date));v=T2.length?T2.map(i=>row(i,i.date)).join(''):'<div class="emp">Aún no tienes tareas.</div>'}
 if(tab=='rel')v=relj();
 $('#app').innerHTML=`<header><button class="gl rb" onclick="dr=1;render()">${sv(P.menu)}</button><div style="flex:1"><h1>${tab=='hoy'?ttl:T[tab][0]}</h1><small>${d.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})}</small></div>${tab=='hoy'?`<label class="gl rb" style="position:relative">${sv(P.cal)}<input type="date" value="${sel}" onchange="sel=this.value||sel;render()" style="position:absolute;inset:0;opacity:0"></label>`:''}</header><main>${v}</main>${tab!='rel'?`<button class="fab" onclick="newSheet()">${sv(P.plus)}</button>`:''}<nav class="gl">${Object.entries(T).map(([k,[n,p]])=>`<button class="${tab==k?'s':''}" onclick="tab='${k}';render()">${sv(p)}${n}</button>`).join('')}</nav>`+(dr?`<div class="sc" onclick="dr=0;render()"><div class="dr gl" onclick="event.stopPropagation()"><h1 style="margin-bottom:4px">Rutina</h1><div class="m" style="margin-bottom:20px;text-transform:capitalize">${new Date().toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})}</div><button class="it" onclick="tab='hoy';dr=0;render()">${sv(P.home)}Inicio</button><button class="it" onclick="tab='rel';dr=0;render()">${sv(P.clk)}Cronómetro y temporizador</button><button class="it" onclick="dr=0;render();look()">${sv(P.pal)}Personalizar</button></div></div>`:'')}
const $=s=>document.querySelector(s);
function sheet(h){const e=document.createElement('div');e.className='sc';e.id='sheet';e.innerHTML=`<div class="sh gl">${h}</div>`;e.onclick=x=>{if(x.target==e)closeS()};document.body.appendChild(e)}
const closeS=()=>{$('#sheet')?.remove();render()};
function look(){sheet(`<h2>Personalizar</h2><div class="lb">Color de acento</div><div class="sw">${['#ff3b4e','#ff6a3d','#ff2d95','#e11d48','#b91c1c'].map(c=>`<button style="background:${c};outline:${c==S.acc?'3px solid #fff':'0'}" onclick="S.acc='${c}';save();closeS();look()"></button>`).join('')}</div><button class="btn g" onclick="closeS()">Listo</button>`)}
function newSheet(){sheet(`<h2>Crear nuevo</h2><button class="btn" onclick="frm('h')">Hábito (se repite)</button><button class="btn g" onclick="frm('t')">Tarea (un solo día)</button>`)}
let F;
function frm(type,it){F=it?{...it,days:it.days?[...it.days]:null}:{type,name:'',icon:'star',color:colOf('x'),start:'09:00',dur:30,days:null,date:sel,note:'',done:{}};
 $('.sh').innerHTML=`<h2>${it?'Editar':'Nuevo'} ${F.type=='h'?'hábito':'tarea'}</h2><div style="display:flex;gap:12px;align-items:center;margin-bottom:12px"><span id="pv"></span><input class="in" id="nm" style="margin:0" placeholder="Nombre (ej. Instagram, Gym, Leer)" value="${F.name}" oninput="upd(this.value)"></div>
 <div style="display:flex;gap:10px"><div style="flex:1"><div class="lb">Hora de inicio</div><input class="in" type="time" id="st" value="${F.start}"></div><div style="flex:1"><div class="lb">Duración (min)</div><input class="in" type="number" id="du" value="${F.dur}"></div></div>
 ${F.type=='h'?`<div class="lb">Frecuencia (vacío = todos los días)</div><div class="chips">${['D','L','M','X','J','V','S'].map((l,i)=>`<button class="${F.days?.includes(i)?'s':''}" onclick="dy(${i},this)">${l}</button>`).join('')}</div>`:`<div class="lb">Fecha</div><input class="in" type="date" id="dd" value="${F.date}">`}
 <div class="lb">Nota</div><input class="in" id="nt" value="${F.note||''}" placeholder="Opcional">
 <button class="btn" onclick="sv2()">${it?'Guardar':'Finalizar'}</button>${it?`<button class="btn g" onclick="rm('${it.id}')">Eliminar</button>`:''}`;upd(F.name)}
function upd(n){if(!F.fixed){F.icon=icoOf(n);F.color=colOf(n||'x')}$('#pv').innerHTML=ico(F);F.name=n}
function dy(i,b){F.days=F.days||[];const x=F.days.indexOf(i);x<0?F.days.push(i):F.days.splice(x,1);b.classList.toggle('s');if(!F.days.length)F.days=null}
function sv2(){F.name=$('#nm').value.trim();if(!F.name)return $('#nm').focus();F.start=$('#st').value||'09:00';F.dur=+$('#du').value||0;F.note=$('#nt').value;if(F.type=='t')F.date=$('#dd').value||sel;
 if(F.id){S.items[S.items.findIndex(i=>i.id==F.id)]=F}else{F.id=Date.now()+'';F.created=F.type=='h'?sel:F.date;S.items.push(F)}save();closeS()}
function rm(id){if(confirm('¿Eliminar definitivamente?')){S.items=S.items.filter(i=>i.id!=id);save();closeS()}}
function edit(id){const it=S.items.find(i=>i.id==id);sheet('');let g='';for(let i=-27;i<=0;i++){const k=add(TD(),i);g+=`<i class="${it.done[k]?'o':ap(it,k)&&k<TD()?'x':''}"></i>`}
 const st=stats(it);$('.sh').innerHTML=`<div style="display:flex;gap:12px;align-items:center">${ico(it)}<div><h2 style="margin:0">${it.name}</h2><div class="m">${it.type=='h'?'Hábito':'Tarea'} · ${it.start}–${end(it)}</div></div></div>${it.type=='h'?`<div class="st"><div><b class="fire">${st.s}</b><span>Racha</span></div><div><b>${st.b}</b><span>Mejor</span></div><div><b>${st.pct}%</b><span>Cumplido</span></div></div><div class="grid">${g}</div>`:''}${it.note?`<div class="m" style="margin:8px 0">${it.note}</div>`:''}<button class="btn" onclick="frm('${it.type}',S.items.find(i=>i.id=='${id}'))">Editar</button>`}
// reloj
let rm_={mode:'sw',t:0,run:0,iv:0,min:5};
function relj(){const r=rm_;return`<div class="chips"><button class="${r.mode=='sw'?'s':''}" onclick="rm_.mode='sw';rst();render()">Cronómetro</button><button class="${r.mode=='tm'?'s':''}" onclick="rm_.mode='tm';rst();render()">Temporizador</button></div><div class="gl" style="padding:20px 14px"><div class="big" id="bg">${fm(r.mode=='sw'?r.t:r.min*60000-r.t)}</div>${r.mode=='tm'&&!r.run&&!r.t?`<input class="in" type="number" value="${r.min}" onchange="rm_.min=+this.value||1;render()" style="text-align:center">`:''}<button class="btn" onclick="tgl()">${r.run?'Pausar':'Iniciar'}</button><button class="btn g" onclick="rst();render()">Reiniciar</button></div>`}
const fm=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function tgl(){const r=rm_;if(r.run){clearInterval(r.iv);r.run=0}else{let l=Date.now();r.run=1;r.iv=setInterval(()=>{r.t+=Date.now()-l;l=Date.now();if(r.mode=='tm'&&r.t>=r.min*60000){clearInterval(r.iv);r.run=0;r.t=0;navigator.vibrate?.(300);alert('Tiempo terminado');render();return}const e=$('#bg');if(e)e.textContent=fm(r.mode=='sw'?r.t:r.min*60000-r.t)},200)}render()}
function rst(){clearInterval(rm_.iv);rm_.run=0;rm_.t=0}
save();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
